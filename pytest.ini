[pytest]
testpaths = tests
addopts = -ra
markers =
    integracao: testes da API contra o PostgreSQL de teste (bd_test); pulados sem banco, falham com -m integracao
filterwarnings =
    error::DeprecationWarning
    # migrations/env.py (gerado pelo Flask-Migrate) ainda chama get_engine(); só esse aviso é ignorado.
    ignore:'get_engine' is deprecated:DeprecationWarning
